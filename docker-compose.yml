# Local/production services for the Shakespeare Evidence Desk (Stage 11 - Production & Serving).
# Phoenix is optional for tracing; the API serves the grounded RAG pipeline.

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
  api:
    build: .
    command: uvicorn production.api.main:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - phoenix
